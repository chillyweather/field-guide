<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper: #faf6ed; --ink: #23201a; --faded: #7a7263; --rule: #ddd3c0;
    --confident: #3f6b45; --check: #96701f; --unsure: #9c4a33; --accent: #1f4d66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font: 13px/1.5 Iowan Old Style, Palatino, Georgia, serif;
  }
  .wrap { padding: 14px 16px 26px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .02em; font-weight: 600; }
  .sub { font-size: 11px; color: var(--faded); font-style: italic; margin-top: 2px; }
  .legend { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
            color: var(--faded); margin: 14px 0 7px; border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
  button {
    font-family: inherit; font-size: 12.5px; padding: 8px 13px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor: pointer; border-radius: 2px;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); }
  input, select {
    font-family: inherit; font-size: 12px; padding: 5px 7px; width: 100%;
    border: 1px solid var(--rule); background: #fff; color: var(--ink); border-radius: 2px;
  }
  label { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faded); margin-bottom: 3px; }
  .field { margin-bottom: 8px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > button { flex: 1 1 auto; white-space: nowrap; }
  button.wide { display: block; width: 100%; margin-top: 8px; }
  details summary { cursor: pointer; font-size: 11px; color: var(--faded); margin-bottom: 2px; }
  details[open] summary { margin-bottom: 8px; }

  .specimen { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .num { font-size: 11px; color: var(--faded); min-width: 20px; padding-top: 2px; }
  .plate { width: 52px; height: 52px; border: 1px solid var(--rule); background: #fff;
           object-fit: contain; flex-shrink: 0; cursor: pointer; }
  .body { flex: 1; min-width: 0; }
  .verdict { font-size: 14px; font-weight: 600; }
  .verdict.unsure { font-style: italic; color: var(--unsure); font-weight: 500; }
  .meta { font-size: 10.5px; color: var(--faded); margin-top: 1px; }
  .bar { height: 3px; background: var(--rule); margin-top: 5px; }
  .bar > i { display: block; height: 100%; }
  .confident > i { background: var(--confident); }
  .check > i { background: var(--check); }
  .unsure > i { background: var(--unsure); }
  .contested { font-size: 10.5px; color: var(--unsure); margin-top: 4px; font-style: italic; }
  .runners { font-size: 10px; color: var(--faded); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .status { font-size: 11.5px; color: var(--faded); margin: 10px 0; min-height: 16px; }
  .tally { font-size: 11px; color: var(--faded); margin-top: 10px; line-height: 1.7; }
  .tally b { color: var(--ink); font-weight: 600; }
  .err { color: var(--unsure); font-size: 11.5px; }
  .tally .spend { color: var(--faded); font-size: 10.5px; }
  #record { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 10px; }
  #record summary { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faded); cursor: pointer; }
  #record pre { font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink);
                background: #fff; border: 1px solid var(--rule); padding: 8px; overflow-x: auto;
                white-space: pre; margin: 0; }
  .hint { font-size: 11px; color: var(--faded); }
  .saw { margin-top: 6px; }
  .saw summary { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faded); }
  .saw p { font-size: 11.5px; line-height: 1.45; margin: 5px 0 0; color: var(--ink); }
  .saw p.raw { color: var(--faded); font-style: italic; }
  .saw mark { background: none; color: var(--unsure); font-style: italic; }

  /* A plugin window has no chrome to drag, so the grip is ours to draw. Fixed to
     the viewport rather than the document, so it stays put while results scroll. */
  #grip { position: fixed; right: 0; bottom: 0; width: 16px; height: 16px;
          cursor: nwse-resize; color: var(--rule); }
  #grip:hover { color: var(--faded); }
  #grip svg { display: block; }
  label.inline { display: flex; align-items: center; gap: 6px; margin: 0; text-transform: none;
                 letter-spacing: 0; font-size: 12px; white-space: nowrap; cursor: pointer;
                 color: var(--faded); flex: 0 0 auto; }
  label.inline input { width: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Field Guide</h1>
    <div class="sub">Identification of user-interface components in the wild</div>
  </header>

  <details id="setup">
    <summary>Keys &amp; endpoints</summary>
    <div style="margin-top:10px">
      <div class="field"><label>TypeSafe (Jev) API key</label><input id="jevKey" type="password" placeholder="sk-..."></div>
      <div class="field"><label>Vision API key</label><input id="visionKey" type="password" placeholder="sk-..."></div>
      <div class="field"><label>Jev base URL — needs the local shim running</label><input id="jevBase" placeholder="http://localhost:8787"></div>
      <div class="field"><label>Vision base URL (OpenAI-compatible)</label><input id="visionBase" placeholder="https://api.openai.com/v1"></div>
      <div class="field"><label>Vision model</label><input id="visionModel" placeholder="a vision-capable model id"></div>
      <button class="ghost" id="saveKeys">Save keys</button>
    </div>
  </details>

  <div class="legend">Survey</div>
  <div class="row">
    <button id="run">Identify selection</button>
    <label class="inline"><input type="checkbox" id="mockMode"> work offline</label>
  </div>
  <button class="ghost wide" id="applyAll" hidden>Apply confident names</button>
  <button class="ghost wide" id="buildSheet" hidden>Build sheet on canvas</button>
  <div class="status" id="status">Select the regions you marked, then identify them.</div>

  <div id="results"></div>
  <div class="tally" id="tally"></div>

  <details id="record" hidden>
    <summary>Run record</summary>
    <div class="row" style="margin:8px 0">
      <button class="ghost" id="copyRecord">Copy</button>
      <span class="hint" id="copyHint"></span>
    </div>
    <pre id="recordText"></pre>
  </details>
</div>

<div id="grip" title="Drag to resize">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <path d="M15 6 6 15M15 11l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</div>

<script>
const TAXONOMY = /* __TAXONOMY__ */ {};
const FIXTURES = /* __FIXTURES__ */ { cases: [] };

const JEV_MODEL = "jev-latest";
// Not api.typesafe.ai directly: it runs an origin allowlist and refuses the
// sandboxed iframe's "null" origin, and Origin cannot be set from page
// JavaScript. proxy.js is the shim. The day that origin is allowed, put
// https://api.typesafe.ai here and delete the proxy — nothing else changes.
const DEFAULT_JEV_BASE = "http://localhost:8787";

// Four at a time. Jev allows 1200 requests a minute and the vision host far
// fewer, so the ceiling here is the vision tier rather than Jev; four is a
// fourfold speed-up that no reasonable tier refuses. A run of forty regions
// took over three minutes sequentially, which is long enough that a designer
// goes and does something else and the Figma window loses focus.
const CONCURRENCY = 4;

// Per million tokens. Edit if the tariff moves; the panel reports whatever is
// set here against the usage the two APIs actually returned, so the figure in
// the tally is measured rather than assumed.
const PRICES = {
  visionIn: 2.5,   // gpt-4o
  visionOut: 10.0,
  jevIn: 0.042,    // jev-latest; output is not metered
};
// Any OpenAI-compatible host, so swapping vision provider is a field in the
// panel rather than a code change.
//
// OpenAI is the default for a reason that is not technical. OpenCode Go carries
// a vision model and was the subscription in hand, but its docs state it is
// "designed for OpenCode and other coding agents that produce similar types of
// requests", it requires an x-opencode-session header, and it monitors traffic.
// Screenshots sent to a vision model are not coding-agent traffic, and adding
// the header would make the request look compliant without making it so.
const DEFAULT_VISION_BASE = "https://api.openai.com/v1";

/* __WEIGH__ */

/* __VOCABULARY__ */

/* __QUESTIONS__ */

const el = (id) => document.getElementById(id);
const useMock = () => el("mockMode").checked;
const post = (msg) => parent.postMessage({ pluginMessage: msg }, "*");
let keys = {}, specimens = [], pending = null, lastContext = null, lastRun = null;

post({ type: "load-keys" });

el("saveKeys").onclick = () => {
  keys = {
    jev: el("jevKey").value.trim(),
    jevBase: el("jevBase").value.trim() || DEFAULT_JEV_BASE,
    vision: el("visionKey").value.trim(),
    visionBase: el("visionBase").value.trim() || DEFAULT_VISION_BASE,
    visionModel: el("visionModel").value.trim(),
  };
  post({ type: "save-keys", keys });
  el("setup").open = false;
};
el("run").onclick = () => {
  if (!useMock() && (!keys.jev || !keys.vision || !keys.visionModel)) {
    el("setup").open = true;
    return say("Two keys and a vision model name are needed before a live survey.", true);
  }
  el("run").disabled = true; el("applyAll").hidden = true;
  el("buildSheet").hidden = true; el("record").hidden = true;
  el("results").innerHTML = ""; el("tally").textContent = "";
  say("Collecting selected regions…");
  post({ type: "collect" });
};
// Everything the guide put a name to, including the held-back ones — they carry
// their standing on the card. A sheet showing only the confident answers would
// read as a cleaner result than the run actually was.
el("buildSheet").onclick = () => {
  const items = specimens
    .filter((s) => s.override || (!s.error && s.answer))
    .map((s) => ({
      id: s.id, name: s.name, answer: named(s), guess: s.error ? null : s.answer,
      confidence: s.confidence, verdict: s.override ? "yours" : s.verdict,
    }));
  if (!items.length) return say("Nothing identified to lay out.", true);
  el("buildSheet").disabled = true;
  say("Building the sheet…");
  post({ type: "sheet", items });
};

el("copyRecord").onclick = async () => {
  const text = el("recordText").textContent;
  try {
    await navigator.clipboard.writeText(text);
    el("copyHint").textContent = "copied";
  } catch (error) {
    // The sandbox can refuse clipboard access. Selecting the text is then the
    // most that can be done for the user, and it is enough.
    const range = document.createRange();
    range.selectNodeContents(el("recordText"));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    el("copyHint").textContent = "selected — press " + (navigator.platform.indexOf("Mac") >= 0 ? "Cmd-C" : "Ctrl-C");
  }
  setTimeout(() => { el("copyHint").textContent = ""; }, 4000);
};

/**
 * What a region is called now: your word if you gave one, else the guide's.
 *
 * Below the ask-a-human line the guide has not named it, so it is Other — not
 * its top pick. The sheet used to file a 0.48 guess under a "Tabs" heading
 * while the panel said "Could not identify", which is the sheet claiming an
 * answer the run did not reach.
 */
function named(s) {
  if (s.override) return s.override;
  if (s.verdict === "unsure") return "Other";
  return s.answer;
}

/** Everything that has a name to apply — the confident answers and your overrides. */
function applicable() {
  return specimens.filter((s) => s.override || (!s.error && s.verdict === "confident"));
}

el("applyAll").onclick = () => {
  const names = applicable().map((s) => ({ id: s.id, name: named(s) }));
  post({ type: "apply", names });
};

onmessage = async (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === "keys") {
    keys = msg.keys || {};
    el("jevKey").value = keys.jev || ""; el("visionKey").value = keys.vision || "";
    el("jevBase").value = keys.jevBase || DEFAULT_JEV_BASE;
    el("visionBase").value = keys.visionBase || DEFAULT_VISION_BASE;
    el("visionModel").value = keys.visionModel || "";
    if (!keys.jev || !keys.vision || !keys.visionModel) el("setup").open = true;
  }
  if (msg.type === "collected") await survey(msg);
  if (msg.type === "applied") say(`Applied ${msg.applied} name${msg.applied === 1 ? "" : "s"}.`);
  if (msg.type === "sheet-built") {
    el("buildSheet").disabled = false;
    say(msg.count
      ? `Sheet built — ${msg.count} region${msg.count === 1 ? "" : "s"} in ${msg.groups} group${msg.groups === 1 ? "" : "s"}, to the left of the screenshot.`
      : "Nothing to lay out.", !msg.count);
  }
  if (msg.type === "failed") {
    // Every button that could have started this has to come back, or a failure
    // reads as the plugin having done nothing at all.
    el("run").disabled = false;
    el("buildSheet").disabled = false;
    say(msg.message, true);
  }
};

function say(text, isError) {
  const s = el("status"); s.textContent = text; s.className = isError ? "status err" : "status";
}

async function survey({ specimens: collected, context, contextName, reason }) {
  if (reason === "nothing-selected" || !collected.length) {
    el("run").disabled = false;
    return say("Nothing selected. Mark some regions first.", true);
  }
  const contextB64 = context ? toB64(context) : null;
  // Said out loud, because its absence changed every answer on an earlier run
  // without appearing anywhere in the output.
  if (!useMock()) {
    say(contextB64
      ? "Context: " + contextName + ". Identifying " + collected.length + " regions…"
      : "No surrounding context found — identifying " + collected.length + " regions from crops alone.");
  }
  lastContext = contextB64 ? contextName : null;

  // Results are placed by index, never appended. Under concurrency the order of
  // completion is not the order of the selection, and a list that reshuffles as
  // it fills is unreadable — and worse, the numbers beside each plate would stop
  // matching what the designer marked.
  const slots = new Array(collected.length).fill(null);
  const spend = { visionIn: 0, visionOut: 0, jevIn: 0 };
  // Wall clock, not the sum of the stages. With four workers those differ by
  // roughly the concurrency factor, and the number a designer experiences is
  // this one.
  const startedAt = Date.now();
  let done = 0;

  const show = () => { specimens = slots.filter(Boolean); render(); };

  async function identifyOne(item) {
    const cropB64 = toB64(item.bytes);
    try {
      // Offline, a canned case stands in for both calls. The weighing below is
      // the same code either way, which is the only reason the offline run is
      // worth looking at.
      const fixture = useMock() ? FIXTURES.cases[(item.index - 1) % FIXTURES.cases.length] : null;

      // The vision model describes and does not decide. Keeping the naming out
      // of this step is what leaves the identification to Jev and the guide,
      // rather than to whatever taxonomy the vision model happens to hold.
      const tVision = Date.now();
      let seen = fixture ? { text: fixture.description, usage: null } : null;
      if (!seen) seen = await describeRegion({ cropB64, contextB64, geometry: item.geometry });
      const visionMs = Date.now() - tVision;
      if (seen.usage) {
        spend.visionIn += seen.usage.prompt_tokens || 0;
        spend.visionOut += seen.usage.completion_tokens || 0;
      }

      // ...and when it decides anyway, the giveaway word goes before the guide
      // ever sees it. Measured rather than assumed — see src-vocabulary.js.
      const described = maskVocabulary(seen.text);

      const tJev = Date.now();
      let judged = fixture ? { answers: fixture.answers, usage: null } : null;
      if (!judged) judged = await askJev(described.text, item.geometry);
      const jevMs = Date.now() - tJev;
      if (judged.usage) spend.jevIn += judged.usage.input_tokens || 0;

      slots[item.index - 1] = Object.assign({}, item, weigh(judged.answers, TAXONOMY), {
        description: described.text,
        rawDescription: seen.text,
        masked: described.masked,
        leaked: described.leaked,
        plate: cropB64,
        offline: Boolean(fixture),
        visionMs,
        jevMs,
        visionIn: (seen.usage && seen.usage.prompt_tokens) || 0,
        visionOut: (seen.usage && seen.usage.completion_tokens) || 0,
        jevIn: (judged.usage && judged.usage.input_tokens) || 0,
      });
    } catch (error) {
      // One region failing must not lose the other thirty-nine.
      slots[item.index - 1] = Object.assign({}, item, {
        error: String((error && error.message) || error),
        plate: cropB64,
      });
    }
    done++;
    say(`Identified ${done} of ${collected.length}${useMock() ? " (offline)" : ""}…`);
    show();
  }

  // A fixed set of workers pulling from one queue, rather than chunked batches:
  // regions differ in cost, and a batch of four only moves on when its slowest
  // member finishes, leaving three connections idle for as long as that takes.
  let cursor = 0;
  const workers = Array.from({ length: Math.min(CONCURRENCY, collected.length) }, async () => {
    while (cursor < collected.length) await identifyOne(collected[cursor++]);
  });
  await Promise.all(workers);

  show();
  el("run").disabled = false;
  el("applyAll").hidden = !applicable().length;
  el("buildSheet").hidden = !specimens.some((s) => !s.error && s.answer);
  say(useMock() ? "Survey complete — offline, from fixtures." : "Survey complete.");
  const elapsedMs = Date.now() - startedAt;
  lastRun = { spend, elapsedMs };
  tally(spend, elapsedMs);
  publishRecord(spend, elapsedMs);
}
/**
 * The one seam to swap if you change vision providers. In, image; out, prose.
 *
 * Written to the OpenAI chat-completions shape because that is what nearly
 * every host speaks, Zen and OpenAI included, so the provider is a field in the
 * panel rather than a rewrite here.
 */
async function describeRegion({ cropB64, contextB64, geometry }) {
  const content = [];
  if (contextB64) {
    content.push({ type: "text", text: "First image: the whole screen, for context only." });
    content.push({ type: "image_url", image_url: { url: "data:image/png;base64," + contextB64 } });
  }
  content.push({ type: "text", text: "Next image: the region to describe." });
  content.push({ type: "image_url", image_url: { url: "data:image/png;base64," + cropB64 } });
  content.push({ type: "text", text:
    "Describe this region of a user interface in 2-3 sentences, factually.\n" +
    "Cover: shape and corner treatment, fill and border, any text and its wording, any icons, " +
    "and any visible state such as a check mark, a sliding thumb, a chevron, or a dismiss affordance. " +
    // Asked for both ways. Told only to mention an overlay when there was one,
    // the model mentioned nothing when there was not, and a panel sitting in the
    // corner of an undimmed page read to the guide as a modal: the crop had a
    // title, an action and a close ×, and nothing said it was not floating.
    "Then, in one more sentence, state whether it overlays other content and whether the area " +
    "around it is dimmed, blurred or darkened. Answer both explicitly, including when the answer is no" +
    (contextB64 ? "." : "; there is no context image here, so say that you cannot tell.") + "\n" +
    "Geometry from the design file: " + geometry + "\n\n" +
    "Do NOT name the component type and do NOT use design-system vocabulary " +
    "(no 'button', 'chip', 'badge', 'input', 'card', 'modal', and so on). Describe only what is visible." });

  const base = (keys.visionBase || DEFAULT_VISION_BASE).replace(/\/+$/, "");
  const res = await fetch(base + "/chat/completions", {
    method: "POST",
    headers: { "content-type": "application/json", authorization: "Bearer " + keys.vision },
    body: JSON.stringify({
      model: keys.visionModel,
      max_tokens: 300,
      messages: [{ role: "user", content }],
    }),
  });
  if (!res.ok) throw new Error("Vision " + res.status + ": " + (await res.text()).slice(0, 160));

  const data = await res.json();
  const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!text) throw new Error("Vision returned no text: " + JSON.stringify(data).slice(0, 160));
  return { text: String(text).trim(), usage: data.usage || null };
}

/**
 * One call, several atomic questions.
 *
 * The family choice and the probes are not decoration: they are an independent
 * read on the same state, and code below treats a disagreement between them and
 * the component answer as a reason to distrust a high probability.
 */
async function askJev(description, geometry) {
  const base = (keys.jevBase || DEFAULT_JEV_BASE).replace(/\/+$/, "");
  let res;
  try {
    res = await fetch(base + "/v1/systemone", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + keys.jev },
      body: JSON.stringify({
        model: JEV_MODEL,
        state: buildState(description, geometry),
        questions: buildQuestions(TAXONOMY),
      }),
    });
  } catch (networkError) {
    // A refused connection here is nearly always the shim not running, and the
    // browser's own message for that says nothing useful.
    const local = base.indexOf("127.0.0.1") >= 0 || base.indexOf("localhost") >= 0;
    throw new Error(local
      ? "Cannot reach the Jev shim at " + base + " — is it running? (node proxy.js)"
      : "Cannot reach " + base + " — " + networkError.message);
  }
  if (!res.ok) throw new Error("Jev " + res.status + ": " + (await res.text()).slice(0, 160));

  const body = await res.json();
  return { answers: body.answers, usage: body.usage || null };
}

function render() {
  el("results").innerHTML = "";
  for (const s of specimens) el("results").appendChild(card(s));
}

/**
 * Every region can be renamed, including the ones named automatically. A
 * confident answer is still only the guide's reading of a crop — it cannot see
 * that a "Modal Dialog" sits in the corner with nothing dimmed behind it.
 */
function picker(s, node) {
  const pick = document.createElement("select");
  pick.style.marginTop = "6px";
  // A held-back answer starts on the placeholder, so choosing the guide's own
  // suggestion counts as a choice. A confident one starts on the name already
  // applied, and changing it is the override.
  const current = s.override || (!s.error && s.verdict === "confident" ? s.answer : "");
  pick.innerHTML = '<option value="">' + (current ? "— rename —" : "— name it yourself —") + "</option>" +
    Object.keys(TAXONOMY.components).map((n) =>
      "<option" + (n === current ? " selected" : "") + ">" + esc(n) + "</option>").join("");
  pick.onchange = () => {
    if (!pick.value) return;
    s.override = pick.value === s.answer && s.verdict === "confident" ? null : pick.value;
    post({ type: "apply", names: [{ id: s.id, name: pick.value }] });
    node.replaceWith(card(s));
    el("applyAll").hidden = !applicable().length;
    if (lastRun) {
      tally(lastRun.spend, lastRun.elapsedMs);
      publishRecord(lastRun.spend, lastRun.elapsedMs);
    }
  };
  return pick;
}

function card(s) {
  const node = document.createElement("div");
  node.className = "specimen";

  const num = document.createElement("div");
  num.className = "num"; num.textContent = String(s.index).padStart(2, "0");

  const plate = document.createElement("img");
  plate.className = "plate"; plate.src = "data:image/png;base64," + s.plate;
  plate.title = "Show on canvas";
  plate.onclick = () => post({ type: "focus", id: s.id });

  const body = document.createElement("div");
  body.className = "body";

  if (s.error) {
    body.innerHTML = '<div class="verdict unsure">Not identified</div><div class="err">' + esc(s.error) + "</div>";
  } else {
    const label = document.createElement("div");
    label.className = "verdict" + (s.verdict === "unsure" && !s.override ? " unsure" : "");
    label.textContent = s.override || (s.verdict === "unsure" ? "Could not identify" : s.answer);

    // Once overridden, the guide's answer stays on the card. The point of the
    // record is where the guide and the designer parted, not just the outcome.
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = s.override
      ? "named by you · guide said " + s.answer + " " + s.confidence.toFixed(2)
      : "confidence " + s.confidence.toFixed(2) +
        (s.verdict === "confident" ? " · named automatically" : " · awaiting your call") +
        (s.familyAgrees ? "" : " · disagrees with " + s.family) +
        (s.unmet && s.unmet.length ? " · probe says not: " + s.unmet.join(", ").replace(/_/g, " ") : "");

    const bar = document.createElement("div");
    bar.className = "bar " + s.verdict;
    bar.innerHTML = '<i style="width:' + Math.round(s.confidence * 100) + '%"></i>';

    const runners = document.createElement("div");
    runners.className = "runners";
    runners.textContent = s.runners.map(([n, p]) => n + " " + p.toFixed(2)).join("   ");

    body.append(label, meta, bar, runners);

    if (s.masked) {
      const note = document.createElement("div");
      note.className = "contested";
      note.textContent = "Vision model named it (" + s.leaked.join(", ") + ") — masked before identification.";
      body.appendChild(note);
    }

    if (s.contested) {
      const note = document.createElement("div");
      note.className = "contested";
      const pair = s.runners.slice(0, 2).map(([n]) => n).join(" / ");
      note.textContent = "Confusion pair: " + pair + ". The guide does not separate these.";
      body.appendChild(note);
    }

    // What the vision model actually said, on demand. Every wrong
    // identification is diagnosed here first: a bad answer from a good
    // description is the guide's fault, and the reverse is the model's.
    const saw = document.createElement("details");
    saw.className = "saw";
    const sum = document.createElement("summary");
    sum.textContent = "What the vision model saw";
    saw.appendChild(sum);

    const said = document.createElement("p");
    if (s.masked) {
      for (const part of String(s.description).split(/(\[element\])/g)) {
        if (part === "[element]") {
          const m = document.createElement("mark");
          m.textContent = "[element]";
          said.appendChild(m);
        } else said.appendChild(document.createTextNode(part));
      }
    } else said.textContent = s.description;
    saw.appendChild(said);

    if (s.masked) {
      const raw = document.createElement("p");
      raw.className = "raw";
      raw.textContent = "Before masking: " + s.rawDescription;
      saw.appendChild(raw);
    }
    body.appendChild(saw);
  }

  body.appendChild(picker(s, node));
  node.append(num, plate, body);
  return node;
}

/**
 * The run, as a table that can leave the plugin.
 *
 * The tally summarises; this is the evidence. A measured run is only worth
 * having if the figures can be pasted into a write-up afterwards, and a Figma
 * panel is otherwise a place numbers go to die — there is no scrollback and
 * nothing survives the next run.
 *
 * Tab-separated, so it lands in a spreadsheet or a Markdown table without
 * reformatting.
 */
/** The single reason a region was not named, in the order the gates apply. */
function heldBy(s) {
  if (s.verdict === "confident") return "-";
  if (s.confidence < NEEDS_HUMAN) return "low-confidence";
  if (!s.familyAgrees) return "family";
  if (s.unmet && s.unmet.length) return "probe";
  if (s.contested) return "contested";
  return "below-threshold";
}

function publishRecord(spend, elapsedMs) {
  const live = specimens.filter((s) => !s.error);
  const median = (xs) => {
    if (!xs.length) return 0;
    const sorted = xs.slice().sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
  };
  const visionMs = live.map((s) => s.visionMs || 0);
  const jevMs = live.map((s) => s.jevMs || 0);
  const vision = (spend.visionIn * PRICES.visionIn + spend.visionOut * PRICES.visionOut) / 1e6;
  const jev = (spend.jevIn * PRICES.jevIn) / 1e6;
  const money = (v) => "$" + (v < 0.01 ? v.toFixed(5) : v.toFixed(4));

  const head = [
    "#", "region", "answer", "confidence", "verdict", "held_by", "yours", "family", "contested", "masked",
    "vision_ms", "jev_ms", "vision_in", "vision_out", "jev_in",
  ].join("\t");

  const rows = specimens.map((s) => [
    String(s.index).padStart(2, "0"),
    s.name || "",
    s.error ? "FAILED" : s.answer,
    s.error ? "" : Number(s.confidence).toFixed(2),
    s.error ? s.error.slice(0, 60) : s.verdict,
    // Why it was not named. Without this a row reading "1.00 / check" is a
    // mystery, and four such rows in an eighteen-region run could not be
    // explained from the record at all.
    s.error ? "" : heldBy(s),
    s.override || "-",
    s.error ? "" : (s.family || ""),
    s.contested ? "yes" : "no",
    s.masked ? s.leaked.join("|") : "no",
    s.visionMs || "", s.jevMs || "",
    s.visionIn || "", s.visionOut || "", s.jevIn || "",
  ].join("\t"));

  const summary = [
    "# Field Guide run — " + new Date().toISOString().slice(0, 16).replace("T", " "),
    specimens.length + " regions · " + (elapsedMs / 1000).toFixed(1) + "s wall · " +
      CONCURRENCY + " at a time" + (useMock() ? " · OFFLINE, no calls made" : ""),
    "context " + (lastContext ? lastContext : "NONE — crops only"),
    "named " + specimens.filter((s) => s.verdict === "confident").length +
      " · check " + specimens.filter((s) => s.verdict === "check").length +
      " · unsure " + specimens.filter((s) => s.verdict === "unsure").length +
      " · masked " + specimens.filter((s) => s.masked).length +
      " · failed " + specimens.filter((s) => s.error).length +
      " · overridden " + specimens.filter((s) => s.override).length,
    "held by  family " + live.filter((s) => heldBy(s) === "family").length +
      " · probe " + live.filter((s) => heldBy(s) === "probe").length +
      " · contested " + live.filter((s) => heldBy(s) === "contested").length +
      " · low-confidence " + live.filter((s) => heldBy(s) === "low-confidence").length +
      " · below-threshold " + live.filter((s) => heldBy(s) === "below-threshold").length,
    "vision  median " + median(visionMs) + "ms  max " + Math.max(0, ...visionMs) + "ms  " +
      spend.visionIn.toLocaleString() + " in / " + spend.visionOut.toLocaleString() + " out  " + money(vision),
    "jev     median " + median(jevMs) + "ms  max " + Math.max(0, ...jevMs) + "ms  " +
      spend.jevIn.toLocaleString() + " in  " + money(jev),
    "total   " + money(vision + jev) +
      (vision > 0 && jev > 0 ? "  (vision is " + Math.round(vision / jev) + "x jev)" : ""),
    "",
  ].join("\n");

  const text = summary + [head].concat(rows).join("\n") + "\n";
  el("recordText").textContent = text;
  el("record").hidden = false;
  // Also to the dev console, which is the one place in Figma with scrollback.
  console.log(text);
}

/** The numbers the write-up needs, counted rather than remembered. */
function tally(spend, elapsedMs) {
  const n = specimens.length;
  const named = specimens.filter((s) => s.verdict === "confident").length;
  const checked = specimens.filter((s) => s.verdict === "check").length;
  const unsure = specimens.filter((s) => s.verdict === "unsure").length;
  const contested = specimens.filter((s) => s.contested).length;
  const failed = specimens.filter((s) => s.error).length;
  const masked = specimens.filter((s) => s.masked).length;

  const lines = [
    "<b>" + named + "</b> of <b>" + n + "</b> named automatically" +
      (elapsedMs ? " in <b>" + (elapsedMs / 1000).toFixed(1) + "s</b>" : ""),
    "<b>" + checked + "</b> to check · <b>" + unsure + "</b> left for you" +
      (failed ? " · <b>" + failed + "</b> failed" : ""),
    "<b>" + contested + "</b> contested by the guide itself",
  ];
  const overridden = specimens.filter((s) => s.override).length;
  if (overridden) lines.push("<b>" + overridden + "</b> renamed by you");
  if (masked) lines.push("<b>" + masked + "</b> had the vision model's vocabulary masked");

  // Reported from the usage the two APIs returned, not from an estimate — the
  // split is the point. The vision step costs many times what the
  // identification does, which is the opposite of what the pricing pages
  // suggest when read separately.
  if (spend && (spend.visionIn || spend.jevIn)) {
    const vision = (spend.visionIn * PRICES.visionIn + spend.visionOut * PRICES.visionOut) / 1e6;
    const jev = (spend.jevIn * PRICES.jevIn) / 1e6;
    const money = (v) => "$" + (v < 0.01 ? v.toFixed(5) : v.toFixed(4));
    lines.push(
      "<span class='spend'>" + money(vision + jev) + " — vision " + money(vision) +
      " (" + spend.visionIn.toLocaleString() + " in / " + spend.visionOut.toLocaleString() + " out)" +
      ", jev " + money(jev) + " (" + spend.jevIn.toLocaleString() + " in)</span>",
    );
  }

  el("tally").innerHTML = lines.join("<br>");
}
/**
 * Window resizing.
 *
 * Figma gives a plugin window no draggable chrome, so the grip above is the
 * whole mechanism: the iframe reports the size it wants and the plugin thread
 * performs it, because figma.ui.resize does not exist on this side.
 *
 * The pointer is captured on the grip, so a fast drag that leaves the 16px
 * target keeps resizing instead of stopping the moment the cursor outruns it.
 * Sizes are read straight from the pointer because the window grows from its
 * top-left corner, which keeps clientX/clientY and the new size the same number.
 */
(function enableResize() {
  const grip = el("grip");
  let dragging = false;

  grip.addEventListener("pointerdown", (event) => {
    dragging = true;
    grip.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  grip.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    post({ type: "resize", width: Math.floor(event.clientX + 8), height: Math.floor(event.clientY + 8) });
  });

  const stop = (event) => {
    if (!dragging) return;
    dragging = false;
    try { grip.releasePointerCapture(event.pointerId); } catch (e) { /* already released */ }
    // Persisted only on release, so a drag writes one record rather than one per frame.
    post({ type: "resize", width: Math.floor(event.clientX + 8), height: Math.floor(event.clientY + 8), remember: true });
  };
  grip.addEventListener("pointerup", stop);
  grip.addEventListener("pointercancel", stop);
})();

function toB64(bytes) {
  let s = "";
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i += 0x8000) s += String.fromCharCode.apply(null, arr.subarray(i, i + 0x8000));
  return btoa(s);
}
function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
</script>
